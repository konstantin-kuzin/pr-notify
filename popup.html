<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Я не вижу ваших лайков!</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <div class="popup__header-main">
          <h1 class="popup__title">Я не вижу ваших лайков!</h1>
        </div>
        <div class="popup__header-status">
          <p class="popup__last-updated" id="last-updated" title="Последняя проверка">ещё не выполнялась</p>
          <button
            class="popup__refresh"
            id="refresh-button"
            type="button"
            aria-label="Обновить сейчас"
            title="Обновить сейчас"
          >
            <svg class="popup__refresh-icon" viewBox="0 0 20 20" aria-hidden="true">
              <path
                fill="currentColor"
                d="M10 16c-1.668 0-3.082-.582-4.25-1.75C4.582 13.082 4 11.668 4 10c0-1.668.582-3.082 1.75-4.25C6.918 4.582 8.332 4 10 4a5.68 5.68 0 0 1 2.512.563c.77.375 1.433.875 1.988 1.5V4H16v5h-5V7.5h2.73a4.443 4.443 0 0 0-1.585-1.457A4.332 4.332 0 0 0 10 5.5c-1.25 0-2.313.438-3.188 1.313S5.5 8.75 5.5 10c0 1.25.438 2.313 1.313 3.188C7.688 14.062 8.75 14.5 10 14.5c1.168 0 2.168-.387 3-1.156a4.425 4.425 0 0 0 1.438-2.844h1.542c-.125 1.555-.757 2.86-1.898 3.918C12.945 15.473 11.582 16 10 16Zm0 0"
              />
            </svg>
          </button>
          <div class="popup__count" id="count-badge">0</div>
        </div>
      </header>

      <section class="popup__message hidden" id="message-box"></section>

      <nav class="popup__tabs" role="tablist" aria-label="Списки pull request">
        <button
          class="popup__tab popup__tab--active"
          id="tab-review"
          type="button"
          role="tab"
          aria-selected="true"
          data-tab="review"
        >Review</button>
        <button
          class="popup__tab"
          id="tab-my"
          type="button"
          role="tab"
          aria-selected="false"
          data-tab="my"
        >My PRs</button>
      </nav>

      <section class="popup__content">
        <div class="popup__empty hidden" id="empty-state">
          <span id="empty-state-text">Нет pull requests для ревью</span>
          <p class="popup__empty-setup-hint hidden" id="empty-setup-hint">
            <button type="button" class="popup__empty-setup-link" id="empty-setup-link">Выберите</button> группы ревьюверов в которых вы состоите
          </p>
        </div>
        <ul class="popup__list" id="items-list"></ul>
      </section>

      <footer class="popup__footer">
        <a
          class="popup__github-link"
          href="https://github.com/konstantin-kuzin/pr-notify"
          target="_blank"
          rel="noopener noreferrer"
        >GitHub</a>
        <a
          class="popup__update-chip hidden"
          id="update-chip"
          href="https://github.com/konstantin-kuzin/pr-notify"
          target="_blank"
          rel="noopener noreferrer"
        ></a>
        <button type="button" class="popup__options-link" id="options-link">Настройки</button>
      </footer>
    </main>

    <script type="module" src="popup.mjs"></script>
  </body>
</html>
